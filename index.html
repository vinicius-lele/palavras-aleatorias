<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema de treino de leitura: palavras aleatórias passam na tela a cada N segundos.">
  <title>Palavras Aleatórias — Treino de Leitura</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E7D6F'/%3E%3Cpath d='M26 20l20 12-20 12z' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="menu">
    <div class="ctrl">
      <label class="ctrl-label" for="selNivel">Nível</label>
      <select id="selNivel"></select>
    </div>

    <div class="ctrl">
      <label class="ctrl-label" for="selSegundos">Segundos</label>
      <select id="selSegundos"></select>
    </div>

    <div class="ctrl ctrl-switch">
      <span class="ctrl-label">Texto</span>
      <label class="switch">
        <input type="checkbox" id="caseToggle">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
      <span class="case-state" id="caseState">minúsculo</span>
    </div>

    <button class="btn-play" id="btnToggle" type="button" aria-label="Iniciar">
      <svg id="iconPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <polygon points="6 3 20 12 6 21 6 3"/>
      </svg>
      <svg id="iconStop" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden>
        <rect x="4" y="4" width="16" height="16" rx="2"/>
      </svg>
    </button>
  </header>

  <main class="palavra-area" id="palavraArea">
    <div class="hint" id="hint">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <polygon points="6 3 20 12 6 21 6 3"/>
      </svg>
      <span>Pressione Play para começar</span>
    </div>

    <div class="word-wrap" id="wordWrap">
      <span class="word" id="word"></span>
    </div>

    <div class="counter" id="counter" aria-hidden="true"></div>

    <button class="btn-fs" id="btnFs" type="button" aria-label="Tela cheia">
      <svg id="iconMax" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
        <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
        <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
      <svg id="iconMin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
        <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
        <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
        <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
        <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
      </svg>
    </button>
  </main>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
