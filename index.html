<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plataforma de treino de leitura por níveis: treino livre e atividades baseadas na BNCC para o ensino fundamental.">
  <title>Palavras Aleatórias — Treino de Leitura</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E7D6F'/%3E%3Cpath d='M26 20l20 12-20 12z' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Evita flash branco ao recarregar no modo escuro (default: claro).
    try {
      if (localStorage.getItem("pa.theme") === "1") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) { /* modo privado */ }
  </script>
</head>
<body>

  <!-- A tela inicial e as atividades são montadas aqui pelo roteador. -->
  <div id="app"></div>

  <!-- words.js declara o binding global WORDS (script clássico, editável à mão).
       Precisa vir antes do main.js: módulos ES são defer e rodam depois. -->
  <script src="words.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
